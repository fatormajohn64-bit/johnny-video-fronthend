<section class="home">

  <!-- Header -->
  <header class="home-header">

    <div>
      <span class="home-greeting">
        Welcome back
      </span>

      <h1>
        Johnny Tec OS
      </h1>
    </div>

    <button
      class="icon-button"
      id="settings-button"
      type="button"
      aria-label="Settings"
    >
      ⚙️
    </button>

  </header>


  <!-- Main actions -->
  <section class="home-actions">

    <!-- Generate -->
    <button
      class="action-card"
      id="generate-button"
      type="button"
    >
      <span class="action-icon">
        🎬
      </span>

      <span class="action-content">
        <strong>
          Generate Video
        </strong>

        <small>
          Create a video with AI
        </small>
      </span>

      <span class="action-arrow">
        →
      </span>
    </button>


    <!-- Edit -->
    <button
      class="action-card"
      id="edit-button"
      type="button"
    >
      <span class="action-icon">
        ✂️
      </span>

      <span class="action-content">
        <strong>
          Edit Video
        </strong>

        <small>
          Edit with JSON2Video or Shotstack
        </small>
      </span>

      <span class="action-arrow">
        →
      </span>
    </button>


    <!-- Live -->
    <button
      class="action-card live-card"
      id="live-button"
      type="button"
    >
      <span class="action-icon">
        🎙️
      </span>

      <span class="action-content">
        <strong>
          Live Conversation
        </strong>

        <small>
          Talk with Johnny in real time
        </small>
      </span>

      <span class="action-arrow">
        →
      </span>
    </button>

  </section>


  <!-- Provider status -->
  <section class="provider-section">

    <div class="section-header">
      <h2>
        Video Providers
      </h2>

      <span id="provider-status">
        Checking...
      </span>
    </div>

    <div
      class="provider-list"
      id="provider-list"
    ></div>

  </section>

</section>
