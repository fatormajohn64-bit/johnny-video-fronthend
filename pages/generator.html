<section class="generator-page">

  <!-- Header -->
  <header class="page-header">

    <button
      id="back-home"
      class="back-button"
      type="button"
      aria-label="Back"
    >
      ←
    </button>

    <div>
      <span class="page-label">
        AI VIDEO
      </span>

      <h1>
        Generate Video
      </h1>
    </div>

  </header>


  <!-- Provider -->
  <section class="generator-section">

    <label class="section-title">
      Choose Generator
    </label>

    <div
      id="generator-providers"
      class="generator-providers"
    ></div>

  </section>


  <!-- Prompt -->
  <section class="generator-section">

    <label
      for="video-prompt"
      class="section-title"
    >
      Describe your video
    </label>

    <textarea
      id="video-prompt"
      class="prompt-input"
      rows="6"
      placeholder="Describe the video you want to create..."
    ></textarea>

  </section>


  <!-- Provider settings -->
  <section
    id="generator-settings"
    class="generator-section"
  >
  </section>


  <!-- Generate -->
  <button
    id="generate-video-button"
    class="generate-button"
    type="button"
  >
    <span>
      Generate Video
    </span>

    <span>
      →
    </span>
  </button>


  <!-- Status -->
  <section
    id="generation-status"
    class="generation-status hidden"
  ></section>

</section>
