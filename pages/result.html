<section class="result-page">

  <header class="page-header">

    <button
      id="back-home"
      class="back-button"
      type="button"
      aria-label="Back"
    >
      ←
    </button>

    <div>
      <span class="page-label">
        VIDEO RESULT
      </span>

      <h1>
        Your Video
      </h1>
    </div>

  </header>


  <!--
  |--------------------------------------------------------------------------
  | Video
  |--------------------------------------------------------------------------
  -->

  <section class="result-video-section">

    <div
      id="result-video-container"
      class="result-video-container"
    >

      <div
        id="result-loading"
        class="result-loading"
      >

        <div class="result-spinner"></div>

        <strong>
          Processing video...
        </strong>

        <small id="result-status-text">
          Please wait while your video is rendered.
        </small>

      </div>

      <video
        id="result-video"
        class="hidden"
        controls
        playsinline
        preload="metadata"
      ></video>

    </div>

  </section>


  <!--
  |--------------------------------------------------------------------------
  | Result information
  |--------------------------------------------------------------------------
  -->

  <section
    id="result-info"
    class="result-info hidden"
  >

    <div class="result-info-row">

      <span>
        Provider
      </span>

      <strong
        id="result-provider"
      >
        —
      </strong>

    </div>

    <div class="result-info-row">

      <span>
        Status
      </span>

      <strong
        id="result-state"
      >
        —
      </strong>

    </div>

  </section>


  <!--
  |--------------------------------------------------------------------------
  | Actions
  |--------------------------------------------------------------------------
  -->

  <section
    id="result-actions"
    class="result-actions hidden"
  >

    <button
      id="download-video"
      class="result-button primary"
      type="button"
    >
      <span>
        Download Video
      </span>

      <span>
        ↓
      </span>
    </button>

    <button
      id="edit-result"
      class="result-button secondary"
      type="button"
    >
      <span>
        Edit This Video
      </span>

      <span>
        ✂️
      </span>
    </button>

    <button
      id="generate-another"
      class="result-button secondary"
      type="button"
    >
      <span>
        Generate Another
      </span>

      <span>
        +
      </span>
    </button>

  </section>


  <!--
  |--------------------------------------------------------------------------
  | Error
  |--------------------------------------------------------------------------
  -->

  <section
    id="result-error"
    class="result-error hidden"
  >

    <strong>
      Video processing failed
    </strong>

    <p id="result-error-message">
      Something went wrong.
    </p>

    <button
      id="retry-result"
      class="result-button secondary"
      type="button"
    >
      Try Again
    </button>

  </section>

</section>
